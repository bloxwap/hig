name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      TMPDIR: ${{ runner.temp }}
      NEXT_PUBLIC_BASE_PATH: /hig
      HIG_DOCS_ORIGIN: https://bloxwap.github.io
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: npm run check -w hig-docs
      - name: Require GNU tar (gtar) for Pages artifacts
        run: |
          set -euo pipefail
          if ! command -v gtar >/dev/null 2>&1; then
            echo "actions/upload-pages-artifact on macOS needs gtar (Homebrew gnu-tar). See docs/ci-runners.md."
            exit 1
          fi
          gtar --version | head -n 1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: apps/docs/out

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    env:
      TMPDIR: ${{ runner.temp }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
