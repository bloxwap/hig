name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.docs }}
    steps:
      # PRs build only for docs inputs; pushes and manual runs always build.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            docs:
              - '.github/workflows/docs.yml'
              # Include root manifests, lockfiles, configs and README conservatively.
              - '*'
              - 'apps/docs/**'
              - 'docs/**'
              # docs:build compiles all packages and builds fixtures/web via build.mjs.
              - 'packages/**'
              - 'fixtures/**'
              - 'scripts/**'
              - 'types/**'
              # Both manifests feed generated examples and API documentation.
              - 'planning/examples.json'
              - 'planning/example-symbols.json'

  build:
    needs: changes
    # Skip PRs that change none of the docs build inputs.
    # Security: never run fork PR code on the self-hosted runner.
    if: (needs.changes.outputs.docs == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_BASE_PATH: /hig
      HIG_DOCS_ORIGIN: https://bloxwap.github.io
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Point temp dirs at $RUNNER_TEMP
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          # Minis keep ~/.npm on disk. Do not add cache: npm (1.1–1.3 GB at ~1 MB/s).
          # setup-node v5+ auto-caches npm when packageManager is set; keep this pin
          # or set package-manager-cache: false if the action is upgraded.
      - run: npm ci
      - run: npm run docs:build
      - run: npm run check -w hig-docs
      - name: Require GNU tar (gtar) for Pages artifacts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if ! command -v gtar >/dev/null 2>&1; then
            if command -v brew >/dev/null 2>&1; then
              for dir in "$(brew --prefix)/opt/gnu-tar/bin" "$(brew --prefix gnu-tar)/bin"; do
                if [ -x "$dir/gtar" ]; then
                  echo "$dir" >> "$GITHUB_PATH"
                  PATH="$dir:$PATH"
                  break
                fi
              done
            fi
          fi
          if ! command -v gtar >/dev/null 2>&1; then
            echo "actions/upload-pages-artifact on macOS needs gtar on PATH."
            echo "Install on the runner with: brew install gnu-tar"
            echo "See docs/ci-runners.md."
            exit 1
          fi
          gtar --version | head -n 1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: apps/docs/out

  deploy:
    # Security: never run fork PR code on the self-hosted runner.
    if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: build
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
