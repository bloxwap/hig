name: Maintainer-approved npm release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v0.1.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hig-npm-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  prerequisites:
    # Only gh/git checks: no OIDC token, so it runs on the minis. publish alone needs a hosted runner.
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      release-sha: ${{ steps.gates.outputs.release-sha }}
      quality-run: ${{ steps.gates.outputs.quality-run }}
      artifact-id: ${{ steps.gates.outputs.artifact-id }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require configured maintainer approval and successful quality gates
        id: gates
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v ]] || { echo 'Release tag must start with v' >&2; exit 1; }
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" || { echo 'Dispatch this workflow with --ref set to the release tag so OIDC provenance identifies the tagged source.' >&2; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            release_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          else
            release_sha="$GITHUB_SHA"
          fi
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          reviewers=$(gh api "repos/$GH_REPO/environments/npm-release" --jq '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]] | length')
          test "$reviewers" -gt 0 || { echo 'Configure required reviewers on the npm-release environment first.' >&2; exit 1; }
          artifact_id=
          for quality_run in $(gh run list --workflow quality.yml --commit "$release_sha" --event workflow_dispatch --status success --limit 20 --json databaseId --jq '.[].databaseId'); do
            artifact_id=$(gh api "repos/$GH_REPO/actions/runs/$quality_run/artifacts" --paginate --jq ".artifacts[] | select(.name == \"hig-stable-release-$release_sha\" and .expired == false) | .id")
            if [ -n "$artifact_id" ]; then break; fi
          done
          [[ "$artifact_id" =~ ^[0-9]+$ ]] || { echo 'Run quality.yml successfully on this exact release tag to prepare a fresh stable artifact.' >&2; exit 1; }
          {
            echo "quality-run=$quality_run"
            echo "artifact-id=$artifact_id"
            echo "release-sha=$release_sha"
          } >> "$GITHUB_OUTPUT"
  publish:
    # Only the npm OIDC operation requires an ephemeral GitHub-hosted runner.
    needs: prerequisites
    environment: npm-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      RELEASE_SHA: ${{ needs.prerequisites.outputs.release-sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Require the approved tag commit
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      # setup-node v4 has no automatic package-manager cache and no cache input is set.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4  # zizmor: ignore[cache-poisoning] (pinned v4 has no implicit cache)
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
      - name: Install the trusted publishing npm CLI
        run: npm install --global npm@11.6.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.prerequisites.outputs.artifact-id }}
          run-id: ${{ needs.prerequisites.outputs.quality-run }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: artifacts/release-stable-simulation
      - name: Verify downloaded report and every tarball before publication
        run: |
          node scripts/verify-release.mjs --report artifacts/release-stable-simulation/report.json --tag "$RELEASE_TAG" --output artifacts/verified-release.txt
      - name: Publish the verified tarballs through npm trusted publishing
        run: |
          set -euo pipefail
          : > artifacts/published-packages.txt
          while IFS= read -r archive; do
            name=$(tar -xOf "$archive" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>console.log(JSON.parse(s).name))')
            version=$(tar -xOf "$archive" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>console.log(JSON.parse(s).version))')
            if published=$(npm view "$name@$version" version) && [ "$published" = "$version" ]; then
              echo "Skipping $name@$version: already published"
            else
              npm publish "$archive" --access public --provenance
              echo "$name@$version" >> artifacts/published-packages.txt
            fi
          done < artifacts/verified-release.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: receipt
        if: always()
        with:
          name: hig-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/published-packages.txt
            artifacts/verified-release.txt
            artifacts/release-stable-simulation/report.json
            artifacts/release-stable-simulation/*.tgz
          retention-days: 14
