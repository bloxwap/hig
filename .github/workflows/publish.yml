name: Maintainer-approved npm release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (e.g. v0.1.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hig-npm-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  security:
    # Single-job publish: adds the scan serially.
    uses: bloxwap/.github/.github/workflows/security-scan.yml@2a70724cd0d803abef5f5a7c64c46065f4fda19b # v1.1.0
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  prerequisites:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      release-sha: ${{ steps.gates.outputs.release-sha }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require configured maintainer approval and successful quality gates
        id: gates
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v ]] || { echo 'Release tag must start with v' >&2; exit 1; }
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG" || { echo 'Dispatch this workflow with --ref set to the release tag so OIDC provenance identifies the tagged source.' >&2; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            release_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          else
            release_sha="$GITHUB_SHA"
          fi
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]]
          reviewers=$(gh api "repos/$GH_REPO/environments/npm-release" --jq '[.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]] | length')
          test "$reviewers" -gt 0 || { echo 'Configure required reviewers on the npm-release environment first.' >&2; exit 1; }
          runs=$(gh run list --workflow quality.yml --commit "$release_sha" --status success --limit 1 --json databaseId --jq length)
          test "$runs" -gt 0 || { echo 'Run the candidate quality workflow successfully for this exact tag commit first.' >&2; exit 1; }
          echo "release-sha=$release_sha" >> "$GITHUB_OUTPUT"
  publish:
    # Trusted publishing requires an ephemeral GitHub-hosted runner.
    needs: [security, prerequisites]
    environment: npm-release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Validate release tag
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v ]] || { echo 'Release tag must start with v' >&2; exit 1; }
          git check-ref-format "refs/tags/$RELEASE_TAG"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Require the approved tag commit
        env:
          RELEASE_SHA: ${{ needs.prerequisites.outputs.release-sha }}
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
      - name: Point temp dirs at $RUNNER_TEMP
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4  # zizmor: ignore[cache-poisoning] (v4 has no implicit cache; see note below)
        with:
          node-version: '24.22.1'
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the trusted publishing npm CLI
        run: npm install --global npm@11.6.1
      - run: npm ci
      - name: Generate native fonts
        run: bash scripts/ci-generate-fonts.sh
      - run: npm run check
      - run: npm run quality
      - run: npm run release:dry-run -- --channel stable-simulation
      - name: Restore the macOS-rendered docs social image
        # sharp rasterizes og.png text with host system fonts, so Ubuntu output differs
        # from the committed macOS render. The file is docs-only (in no npm package), and
        # its drift is enforced by the Mac-mini quality run required in prerequisites.
        run: git checkout -- apps/docs/public/og.png
      - name: Verify source version, gates, exact package set and tarball hashes
        run: node scripts/verify-release.mjs --report artifacts/release-stable-simulation/report.json --tag "$RELEASE_TAG" --output artifacts/verified-release.txt
      - name: Publish the verified tarballs through npm trusted publishing
        # All eight packages trust this repository, workflow and protected environment.
        # No long-lived token fallback: missing OIDC configuration must fail closed.
        run: |
          set -euo pipefail
          : > artifacts/published-packages.txt
          while IFS= read -r archive; do
            name=$(tar -xOf "$archive" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>console.log(JSON.parse(s).name))')
            version=$(tar -xOf "$archive" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d);process.stdin.on("end",()=>console.log(JSON.parse(s).version))')
            if published=$(npm view "$name@$version" version) && [ "$published" = "$version" ]; then
              echo "Skipping $name@$version: already published"
            else
              npm publish "$archive" --access public --provenance
              echo "$name@$version" >> artifacts/published-packages.txt
            fi
          done < artifacts/verified-release.txt
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke:registry
        env:
          HIG_PROVENANCE_PACKAGES_FILE: artifacts/published-packages.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hig-registry-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/release-stable-simulation/report.json
            artifacts/verified-release.txt
            artifacts/published-packages.txt
            evidence/registry-install.json
          retention-days: 14
