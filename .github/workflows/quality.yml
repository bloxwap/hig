name: HIG candidate quality and dry-run artifacts
on:
  pull_request:
  # Workflow-level paths-ignore is safe on push (no required checks).
  # On pull_request it would skip the workflow entirely and leave required
  # checks pending, so PRs use the paths-filter job below instead.
  push:
    branches: ['hig/**']
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  release-security:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/')
    uses: bloxwap/.github/.github/workflows/security-scan.yml@2a70724cd0d803abef5f5a7c64c46065f4fda19b # v1.1.0
    permissions:
      contents: read
    with:
      runs-on: '["self-hosted","macOS","ARM64"]'
      profile: release
      secrets-days: "7"
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}

  paths-filter:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code == 'true' || steps.filter.outputs.docs == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            docs:
              - 'docs/**'
            code:
              - '**'
              - '!**/*.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/pull_request_template.md'

  compiler:
    # Every same-repository PR, including docs-only and Renovate dependency PRs.
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Point temp dirs at $RUNNER_TEMP
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          # Minis keep ~/.npm on disk. Do not add cache: npm (1.1–1.3 GB at ~1 MB/s).
          # setup-node v5+ auto-caches npm when packageManager is set; keep this pin
          # or set package-manager-cache: false if the action is upgraded.
      - name: Install CPython 3.12
        run: bash scripts/ci-setup-python.sh
      - uses: ./.github/actions/setup-bun
      # Keep bun.lock and package-lock.json in sync; publishing still uses npm ci.
      - run: bun install --frozen-lockfile
      - name: Native fonts (on-disk reuse)
        run: bash scripts/ci-native-fonts.sh
      - name: Check compiler platform selection and comparison
        run: npx vitest run tests/compiler.test.ts
      - name: Exercise TypeScript 7 fallback scripts
        run: npm run docs:check:tsc && npm run typecheck:tsc
      - name: Compare tsrs and TypeScript 7 emit
        run: npm run compiler:parity

  quality:
    needs: paths-filter
    # Security: never run fork PR code on the self-hosted runner.
    if: (needs.paths-filter.outputs.code == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      # No max-parallel cap: independent lanes use every available runner.
      matrix:
        task: [checks, unit-web, unit-native, packed, packed-compat, packed-og, packed-boundaries, packed-chart-workspace, packed-fumadocs, packed-examples, packed-next, packed-css, packed-react-css, release]
    env:
      HIG_QUALITY_TASK: ${{ matrix.task }}
      HIG_RELEASE_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') && 'stable-simulation' || 'candidate' }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Point temp dirs at $RUNNER_TEMP
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          # Minis keep ~/.npm on disk. Do not add cache: npm (1.1–1.3 GB at ~1 MB/s).
          # setup-node v5+ auto-caches npm when packageManager is set; keep this pin
          # or set package-manager-cache: false if the action is upgraded.
      - name: Install CPython 3.12
        run: bash scripts/ci-setup-python.sh
      - uses: ./.github/actions/setup-bun
      # Keep bun.lock and package-lock.json in sync; publishing still uses npm ci (#181).
      - name: package-lock.json matches package.json and bun.lock
        run: node scripts/check-lockfiles.mjs --npm
      - run: bun install --frozen-lockfile
        if: matrix.task != 'release' || env.HIG_RELEASE_CHANNEL != 'stable-simulation'
      - name: Clean install with the release npm version
        if: matrix.task == 'release' && env.HIG_RELEASE_CHANNEL == 'stable-simulation'
        run: npx --yes npm@11.6.1 ci
      - name: Native fonts (on-disk reuse)
        run: bash scripts/ci-native-fonts.sh
      # Reuse ~/Library/Caches/ms-playwright on disk, never via actions/cache.
      - name: Install browsers for packed browser consumers
        if: contains(fromJSON('["packed-next", "packed-css", "packed-react-css"]'), matrix.task)
        run: bunx playwright install chromium webkit
      - name: Run isolated quality lane
        run: node scripts/ci-quality-tasks.mjs
      - name: Verify the stable release input
        if: matrix.task == 'release' && env.HIG_RELEASE_CHANNEL == 'stable-simulation'
        run: node scripts/verify-release.mjs --report artifacts/release-stable-simulation/report.json --tag "$GITHUB_REF_NAME"
      - name: Retain the verified package for publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.task == 'release' && env.HIG_RELEASE_CHANNEL == 'stable-simulation'
        with:
          name: hig-stable-release-${{ github.sha }}
          overwrite: true
          path: |
            artifacts/release-stable-simulation/report.json
            artifacts/release-stable-simulation/*.tgz
          if-no-files-found: error
          retention-days: 14
      # Ordinary PR candidate artifacts are retained only on failure.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: hig-candidate-review-${{ matrix.task }}-${{ github.sha }}
          path: |
            evidence/
            artifacts/*.tgz
            artifacts/og/
            artifacts/release-candidate/
            apps/docs/dist/
            apps/docs/out/
          retention-days: 7

  native:
    needs: paths-filter
    # Security: never run fork PR code on the self-hosted runner.
    if: (needs.paths-filter.outputs.code == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [rn-0.81, rn-0.83, rn-0.88]
    env:
      HIG_NATIVE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Point temp dirs at $RUNNER_TEMP
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          # Minis keep ~/.npm on disk. Do not add cache: npm (1.1–1.3 GB at ~1 MB/s).
          # setup-node v5+ auto-caches npm when packageManager is set; keep this pin
          # or set package-manager-cache: false if the action is upgraded.
      - name: Install CPython 3.12
        run: bash scripts/ci-setup-python.sh
      - uses: ./.github/actions/setup-bun
      # Keep bun.lock and package-lock.json in sync; publishing still uses npm ci.
      - run: bun install --frozen-lockfile
      - name: Native fonts (on-disk reuse)
        run: bash scripts/ci-native-fonts.sh
      - run: bun run generate && node scripts/build.mjs
      - name: Pack this lane's build
        run: mkdir -p artifacts && npm pack ./packages/hig --ignore-scripts --pack-destination artifacts
      - name: Check native consumer
        run: node scripts/packed-native-smoke.mjs --profile "$HIG_NATIVE_PROFILE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: hig-candidate-native-${{ matrix.profile }}-${{ github.sha }}
          path: evidence/
          retention-days: 7

  browser:
    needs: paths-filter
    # Security: never run fork PR code on the self-hosted runner.
    if: (needs.paths-filter.outputs.code == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        gate: [chromium, webkit, expo, acceptance, native-action, native-switch, segmented-control, qr-code, select, css-isolation, pro-data, number-flow, gesture-sheet, confetti, feedback, docs, catalog, next]
    env:
      HIG_BROWSER_GATE: ${{ matrix.gate }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Point temp dirs at $RUNNER_TEMP
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          # Minis keep ~/.npm on disk. Do not add cache: npm (1.1–1.3 GB at ~1 MB/s).
          # setup-node v5+ auto-caches npm when packageManager is set; keep this pin
          # or set package-manager-cache: false if the action is upgraded.
      - name: Install CPython 3.12
        run: bash scripts/ci-setup-python.sh
      - uses: ./.github/actions/setup-bun
      # Keep bun.lock and package-lock.json in sync; publishing still uses npm ci.
      - run: bun install --frozen-lockfile
      - name: Native fonts (on-disk reuse)
        run: bash scripts/ci-native-fonts.sh
      # Do not save ~/Library/Caches/ms-playwright with actions/cache: the folder
      # is shared on-disk across jobs on these minis, and cache save stalls 11+
      # minutes (monorepo #4603). playwright install uses the on-disk cache.
      - name: Build packages/docs and install Playwright
        run: |
          set -euo pipefail
          if [[ "$HIG_BROWSER_GATE" = docs || "$HIG_BROWSER_GATE" = catalog ]]; then
            bun run build &
          else
            (bun run generate && node scripts/build.mjs) &
          fi
          build=$!
          bunx playwright install chromium webkit
          wait "$build"
      - name: Browser, visual and hydration gates
        run: node scripts/run-browser-gates.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: hig-candidate-browser-${{ matrix.gate }}-${{ github.sha }}
          path: |
            evidence/
            artifacts/visual/
          retention-days: 7

  linux-visual:
    needs: paths-filter
    if: needs.paths-filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HIG_VISUAL_ONLY: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      - uses: ./.github/actions/setup-bun
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: npm run build
      - name: Compare Linux Chromium baselines
        run: node scripts/run-browser-gates.mjs
      # Keep fresh captures even on success for intentional baseline regeneration.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hig-linux-visual-${{ github.sha }}
          path: |
            artifacts/visual/
            evidence/visual-actuals/
            evidence/gaps-b-visual-baselines.json
          retention-days: 7

  # Same job name as the previous single required check. Always reports so
  # docs-only PRs are not stuck on "Waiting for status to be reported."
  candidate:
    needs: [paths-filter, compiler, quality, native, browser, linux-visual, release-security]
    # Security: never run fork PR code on the self-hosted runner.
    if: (always() && !cancelled()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Confirm candidate quality
        env:
          RELEASE_TAG_RUN: ${{ github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') }}
          RELEASE_SECURITY: ${{ needs.release-security.result }}
          COMPILER: ${{ needs.compiler.result }}
          CHANGES: ${{ needs.paths-filter.result }}
          CODE: ${{ needs.paths-filter.outputs.code }}
          QUALITY: ${{ needs.quality.result }}
          NATIVE: ${{ needs.native.result }}
          BROWSER: ${{ needs.browser.result }}
          LINUX_VISUAL: ${{ needs.linux-visual.result }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_TAG_RUN" = true ] && [ "$RELEASE_SECURITY" != success ]; then
            echo "release security: $RELEASE_SECURITY"
            exit 1
          fi
          if [ "$CHANGES" != success ]; then
            echo "paths-filter job: $CHANGES"
            exit 1
          fi
          if [ "$COMPILER" != success ]; then
            echo "compiler job: $COMPILER"
            exit 1
          fi
          if [ "$CODE" != true ]; then
            echo "Docs-only change; quality jobs skipped"
            exit 0
          fi
          failed=0
          for pair in "quality:$QUALITY" "native:$NATIVE" "browser:$BROWSER" "linux-visual:$LINUX_VISUAL"; do
            job="${pair%%:*}"
            result="${pair#*:}"
            echo "$job: $result"
            if [ "$result" != success ]; then
              failed=1
            fi
          done
          exit "$failed"
  # Preserve the exact status context required by the main branch ruleset.
  quality-result:
    name: quality
    needs: candidate
    if: (always() && !cancelled()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Require every candidate gate
        env:
          RESULT: ${{ needs.candidate.result }}
        run: test "$RESULT" = success
# No npm publish, git tag, release API, deployment or write permissions.
