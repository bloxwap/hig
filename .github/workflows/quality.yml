name: HIG candidate quality and dry-run artifacts
on:
  pull_request:
  push:
    branches: ['hig/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: python3 -m pip install "fonttools[woff]==4.61.1" "brotli==1.2.0"
      - run: npm run generate:fonts
      - run: npm run check
      - run: npm run examples:check
      - run: npm run quality
      - run: npm run smoke:ssr
      - run: npm run smoke:packed
      - run: npm run smoke:packed-native
      - run: npm run smoke:packed-boundaries
      - run: npm run smoke:packed-fumadocs
      - run: npm run smoke:packed-examples
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run smoke:packed-next
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run smoke:packed-css
      - name: Browser, visual and hydration gates
        run: node scripts/run-browser-gates.mjs
      - run: npm run release:dry-run -- --channel candidate
      - run: npm run smoke:release-artifact -- candidate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hig-candidate-review-${{ github.sha }}
          path: |
            evidence/
            artifacts/*.tgz
            artifacts/visual/
            artifacts/release-candidate/
            apps/docs/dist/
            apps/docs/out/
          retention-days: 14
# No npm publish, git tag, release API, deployment or write permissions.
