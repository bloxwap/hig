name: HIG candidate quality and dry-run artifacts
on:
  pull_request:
  # Workflow-level paths-ignore is safe on push (no required checks).
  # On pull_request it would skip the workflow entirely and leave required
  # checks pending, so PRs use the paths-filter job below instead.
  push:
    branches: ['hig/**']
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hig-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
jobs:
  paths-filter:
    # Security: never run fork PR code on the self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    outputs:
      code: ${{ github.event_name != 'pull_request' && 'true' || steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/pull_request_template.md'

  quality:
    needs: paths-filter
    # Security: never run fork PR code on the self-hosted runner.
    if: (needs.paths-filter.outputs.code == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Point temp dirs at $RUNNER_TEMP
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          # Minis keep ~/.npm on disk. Do not add cache: npm (1.1–1.3 GB at ~1 MB/s).
          # setup-node v5+ auto-caches npm when packageManager is set; keep this pin
          # or set package-manager-cache: false if the action is upgraded.
      - name: Install CPython 3.12
        run: bash scripts/ci-setup-python.sh
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: font-cache
        with:
          path: |
            packages/native-fonts/fonts
            packages/og-fonts/fonts
          key: ${{ runner.os }}-native-fonts-${{ hashFiles('scripts/generate-native-fonts.py', 'package-lock.json') }}
      - name: Generate native fonts
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci-generate-fonts.sh
      - run: npm run check
      - run: npm run examples:check
      - run: npm run quality
      - run: npm run smoke:ssr
      - run: npm run smoke:packed
      - run: npm run smoke:packed-og
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run smoke:packed-boundaries
      - name: Packed chart-shaped workspace, lockfile regenerated from scratch with strict peers (#96)
        run: npm run smoke:packed-chart-workspace
      - run: npm run smoke:packed-fumadocs
      - run: npm run smoke:packed-examples
      # Do not save ~/Library/Caches/ms-playwright with actions/cache: the folder
      # is shared on-disk across jobs on these minis, and cache save stalls 11+
      # minutes (monorepo #4603). playwright install uses the on-disk cache.
      - run: npx playwright install chromium webkit
      - run: npm run smoke:packed-next
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npm run smoke:packed-css
      - run: npm run smoke:packed-react-css
      - run: npm run release:dry-run -- --channel candidate
      - run: npm run smoke:release-artifact -- candidate
      # Dry-run and smoke:release-artifact already ran above. publish.yml rebuilds
      # rather than downloading these. Upload on failure for review (visuals, tarballs).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: hig-candidate-review-${{ github.sha }}
          path: |
            evidence/
            artifacts/*.tgz
            artifacts/og/
            artifacts/release-candidate/
            apps/docs/dist/
            apps/docs/out/
          retention-days: 14

  native:
    needs: paths-filter
    # Security: never run fork PR code on the self-hosted runner.
    if: (needs.paths-filter.outputs.code == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Point temp dirs at $RUNNER_TEMP
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          # Minis keep ~/.npm on disk. Do not add cache: npm (1.1–1.3 GB at ~1 MB/s).
          # setup-node v5+ auto-caches npm when packageManager is set; keep this pin
          # or set package-manager-cache: false if the action is upgraded.
      - name: Install CPython 3.12
        run: bash scripts/ci-setup-python.sh
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: font-cache
        with:
          path: |
            packages/native-fonts/fonts
            packages/og-fonts/fonts
          key: ${{ runner.os }}-native-fonts-${{ hashFiles('scripts/generate-native-fonts.py', 'package-lock.json') }}
      - name: Generate native fonts
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci-generate-fonts.sh
      - run: npm run generate && node scripts/build.mjs
      - run: npm run smoke:packed
      - name: Packed native consumer, RN 0.81.5 / Expo 54 (Android and iOS Metro export)
        run: npm run smoke:packed-native
      - name: Packed native consumer, RN 0.83.10 / Expo 55 (Android and iOS Metro export, #68)
        run: npm run smoke:packed-native -- --profile rn-0.83

  browser:
    needs: paths-filter
    # Security: never run fork PR code on the self-hosted runner.
    if: (needs.paths-filter.outputs.code == 'true') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Point temp dirs at $RUNNER_TEMP
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
          # Minis keep ~/.npm on disk. Do not add cache: npm (1.1–1.3 GB at ~1 MB/s).
          # setup-node v5+ auto-caches npm when packageManager is set; keep this pin
          # or set package-manager-cache: false if the action is upgraded.
      - name: Install CPython 3.12
        run: bash scripts/ci-setup-python.sh
      - run: npm ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: font-cache
        with:
          path: |
            packages/native-fonts/fonts
            packages/og-fonts/fonts
          key: ${{ runner.os }}-native-fonts-${{ hashFiles('scripts/generate-native-fonts.py', 'package-lock.json') }}
      - name: Generate native fonts
        if: steps.font-cache.outputs.cache-hit != 'true'
        run: bash scripts/ci-generate-fonts.sh
      # Do not save ~/Library/Caches/ms-playwright with actions/cache: the folder
      # is shared on-disk across jobs on these minis, and cache save stalls 11+
      # minutes (monorepo #4603). playwright install uses the on-disk cache.
      - name: Build packages/docs and install Playwright
        run: |
          set -euo pipefail
          npm run build &
          build=$!
          npx playwright install chromium webkit
          wait "$build"
      - name: Browser, visual and hydration gates
        run: node scripts/run-browser-gates.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: hig-candidate-browser-${{ github.sha }}
          path: |
            evidence/
            artifacts/visual/
          retention-days: 14

  # Same job name as the previous single required check. Always reports so
  # docs-only PRs are not stuck on "Waiting for status to be reported."
  candidate:
    needs: [paths-filter, quality, native, browser]
    # Security: never run fork PR code on the self-hosted runner.
    if: (always() && !cancelled()) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - name: Confirm candidate quality
        env:
          CHANGES: ${{ needs.paths-filter.result }}
          CODE: ${{ needs.paths-filter.outputs.code }}
          QUALITY: ${{ needs.quality.result }}
          NATIVE: ${{ needs.native.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != success ]; then
            echo "paths-filter job: $CHANGES"
            exit 1
          fi
          if [ "$CODE" != true ]; then
            echo "Docs-only change; quality jobs skipped"
            exit 0
          fi
          failed=0
          for pair in "quality:$QUALITY" "native:$NATIVE" "browser:$BROWSER"; do
            job="${pair%%:*}"
            result="${pair#*:}"
            echo "$job: $result"
            if [ "$result" != success ]; then
              failed=1
            fi
          done
          exit "$failed"
# No npm publish, git tag, release API, deployment or write permissions.
